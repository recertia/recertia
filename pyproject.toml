[project]
name = "recertia"
version = "0.1.0"
description = "Recertia: a self-improving agent system. contracts/ (ADR-0009) is the structural source of truth; src/recertia/ implements the M0–M9 runtime."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Robert Schmidt" }]
requires-python = ">=3.11"
dependencies = [
    # Nightly lowest-deps pins == the >= floor. 2.11 is the first 2.x whose
    # model_json_schema() matches committed schema/; 2.9/2.10 drift.
    "pydantic>=2.11,<3",
    # typer 0.12 + click 8.3+ raises TypeError on boolean secondary flags.
    "typer>=0.13",
    # 4.0.0 is yanked (Improper python_requires declaration).
    "jsonschema>=4.0.1",
]

[project.urls]
Homepage = "https://github.com/recertia/recertia"
Documentation = "https://github.com/recertia/recertia/blob/main/docs/architecture.md"
Repository = "https://github.com/recertia/recertia"
Changelog = "https://github.com/recertia/recertia/blob/main/CHANGELOG.md"
Issues = "https://github.com/recertia/recertia/issues"

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
postgres = [
    # 3.2.1, not 3.2: psycopg 3.2.0's [binary] extra requires psycopg-binary==3.2.0.dev1,
    # which was never uploaded to PyPI, so psycopg[binary]==3.2.0 cannot install (REC-057).
    # psycopg-binary 3.2.1 has wheels up to cp312 only (cp313 starts at 3.2.2), so the
    # floor itself installs on 3.11/3.12, which covers the nightly's 3.11 lowest arm.
    "psycopg[binary]>=3.2.1",
]
pdf = [
    "pypdf>=4",
]
otel = [
    "opentelemetry-api>=1.20",
]
dev = [
    # REC-049: 9.0.0 added the faulthandler_exit_on_timeout ini option that
    # tests/unit/test_faulthandler_backstop.py reads with getini().
    "pytest>=9.0",
    # 2.3.0 was never on PyPI (so the nightly lowest-deps pin could not install), and
    # the suite's backstop tests match 2.4.0's "Timeout (>Ns) from pytest-timeout" text.
    "pytest-timeout>=2.4.0",
    # Nightly lowest-deps requires a >= floor. 0.17.1 is the version CI lint
    # pins; do not lower this floor to 0.6.
    "ruff>=0.17.1",
    # Exactly 2.4.0, the ci.yml pin and the mypy-baseline.txt header version. Written
    # as a >= floor with an equal ceiling because nightly lowest-deps parses ">=".
    "mypy>=2.4.0,<=2.4.0",
    "import-linter>=2.15",
    # REC-022: workflow tests parse .github/workflows with yaml.safe_load.
    "pyyaml>=6.0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # REC-053: test-only floor, so it lives here and not in the runtime deps. src/ never
    # imports click, and typer 0.26+ does not depend on click (it arrives via uvicorn).
    # The CLI tests read result.stderr from a default CliRunner(), which only keeps
    # stderr apart on click>=8.2; typer 0.13 alone would allow click 8.0/8.1.
    "click>=8.2",
]

[project.scripts]
recertia = "recertia.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
timeout_method = "signal"
# Unknown marker names are errors, not warnings (REC-058).
addopts = ["--strict-markers"]
# An xfail that unexpectedly passes is a failure, not a silent XPASS (REC-058).
xfail_strict = true
# Native watchdog: dumps every thread's stack when a test runs past 60s even if the
# main thread is blocked in C, where the signal method's handler cannot run (REC-017).
faulthandler_timeout = 60
markers = [
    "windows: needs real Windows (kernel32); runs in the ci.yml `root lock (windows-latest)` job (REC-058)",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    "tests/probes",
    # TEMPORARY for PR 184: exclude until unused imports in check_commit_trailers.py are cleaned.
    # Revert this exclusion as soon as the file is fixed.
    "scripts/check_commit_trailers.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["contracts", "recertia"]

# Preview codes (B, C90, TID251, RUF100, SIM, UP) stay report-only in CI until
# the env-read migration and the noqa burn-down land. Enabling them in `select`
# here would fail the tree. See scripts and the ruff-preview CI step.

[tool.importlinter]
root_packages = ["recertia"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Recertia layers"
type = "layers"
layers = [
    "recertia.cli : recertia.api : recertia.bootstrap : recertia.workers : (recertia.app)",
    "recertia.jobs",
    "recertia.evals",
    "recertia.review",
    "recertia.graph",
    "recertia.nodes",
    "recertia.solver",
    "recertia.memory : recertia.retrieval : recertia.validation : recertia.ledger : recertia.workspace : recertia.trajectory : recertia.mea : recertia.distill : recertia.programs : recertia.proposals",
    "(recertia.persistence) : (recertia.observability) : (recertia.settings) : (recertia.errors) : (recertia.ports) : (recertia.fsutil)",
    "recertia.governance",
]
ignore_imports = [
    "recertia.distill.paper -> recertia.jobs.arxiv",
    "recertia.governance.sandbox -> recertia.solver.sandbox",
    "recertia.graph.engine -> recertia.review",
    "recertia.mea.runtime -> recertia.nodes._util",
    "recertia.memory.affordance -> recertia.solver.tools",
    "recertia.memory.procedural.applicability -> recertia.solver.registry",
    "recertia.memory.procedural.lint -> recertia.solver.claims",
    "recertia.memory.procedural.promote -> recertia.review.promotion",
    "recertia.nodes.context -> recertia.review",
    "recertia.programs.materialize -> recertia.nodes._util",
    "recertia.review.field_failures -> recertia.evals.store",
    "recertia.review.gate -> recertia.evals.golden",
    "recertia.review.lifecycle -> recertia.evals.store",
    "recertia.review.shadow -> recertia.evals.store",
    "recertia.validation.judge -> recertia.solver.model",
    "recertia.validation.sensitivity -> recertia.nodes.validate",
]

[[tool.importlinter.contracts]]
name = "t3-unreachable"
type = "forbidden"
source_modules = [
    "recertia.nodes",
    "recertia.jobs",
    "recertia.solver",
    "recertia.graph",
    "recertia.memory",
]
forbidden_modules = [
    "recertia.governance",
    "recertia.evals.ablation",
    "recertia.evals.interventions",
    "recertia.evals.faithfulness",
]

[[tool.importlinter.contracts]]
name = "no-replay"
type = "forbidden"
source_modules = ["recertia.nodes"]
forbidden_modules = ["recertia.replay"]

[[tool.importlinter.contracts]]
name = "no-lifecycle"
type = "forbidden"
source_modules = ["recertia.nodes", "recertia.graph"]
forbidden_modules = ["recertia.review.lifecycle"]

[[tool.importlinter.contracts]]
name = "memory-down"
type = "forbidden"
source_modules = ["recertia.memory"]
forbidden_modules = [
    "recertia.solver",
    "recertia.evals",
    "recertia.review",
    "recertia.graph",
    "recertia.nodes",
    "recertia.api",
]
ignore_imports = [
    "recertia.memory.affordance -> recertia.solver.tools",
    "recertia.memory.procedural.applicability -> recertia.solver.registry",
    "recertia.memory.procedural.lint -> recertia.solver.claims",
    "recertia.memory.procedural.promote -> recertia.review.promotion",
]

[[tool.importlinter.contracts]]
name = "evals-no-engine"
type = "forbidden"
source_modules = ["recertia.evals"]
forbidden_modules = ["recertia.graph.engine"]

[[tool.importlinter.contracts]]
name = "api-cli-independent"
type = "independence"
modules = ["recertia.api", "recertia.cli"]
ignore_imports = [
    "recertia.cli.keys -> recertia.api.auth",
]

[tool.mypy]
python_version = "3.11"
files = ["contracts", "src/recertia"]
ignore_missing_imports = true

# contracts/ is type-checked with `mypy --strict contracts/` in ci.yml.
# A [[tool.mypy.overrides]] strict=true block is not used: mypy 2 treats
# several "strict" knobs as global and they leak into src/recertia.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["contracts", "contracts.*", "recertia", "recertia.*"]

[tool.setuptools.package-data]
"recertia" = ["policy_default.json"]
"recertia.store" = ["migrations/*.sql"]
