name: ci

# Validates contracts/ (ADR-0009: the Pydantic models that are the normative structural
# source of truth, and everything generated from it) and src/recertia/ (M0–M9 per
# docs/archive/2026-Q3/implementation-plan.md).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # PR5: unit tests never hold real provider credentials; tests/conftest.py
      # blocks non-loopback network (also forced on by CI=true).
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RECERTIA_NO_NETWORK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs the PR commit range

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Pin ruff
        run: pip install ruff==0.17.1

      - name: Ruff version
        run: ruff --version

      # mypy error counts are version-dependent (1.11.2 gives 196 where 2.4.0 gives
      # 198) and the ratchet below compares them. Keep this pin, the pyproject dev
      # extra and the mypy-baseline.txt header in step; re-seed with --write on a bump.
      - name: Pin mypy
        run: pip install mypy==2.4.0 && mypy --version

      - name: Lint (ruff)
        run: ruff check contracts/ src/ scripts/ tests/ conftest.py

      - name: Lint preview (report-only)
        continue-on-error: true
        run: ruff check --select B,C90,TID251,RUF100,SIM,UP contracts/ src/ scripts/ tests/ conftest.py

      - name: Upload ruff preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-preview
          path: ruff-preview.txt
          if-no-files-found: ignore

      - name: Import contracts
        run: lint-imports

      - name: Type-check (mypy)
        run: mypy contracts/ src/recertia/

      - name: Mypy ratchet
        run: python3 scripts/mypy_ratchet.py

      - name: Type-check strict (contracts/, ADR-0009)
        run: mypy --strict contracts/

      - name: Schema drift (schema/ must equal what contracts/ generates)
        run: python3 scripts/generate_schemas.py --check

      - name: Example drift (skills/bump-python-dep/v3/*.json must equal contracts/examples.py)
        run: python3 scripts/export_examples.py --check

      - name: Seed skill lint (hash-bound sensitivity proofs)
        run: recertia skills lint --skills-root skills

      # Topic files (including assumptions a10 from #47/#48) are source of truth.
      # --check only: regenerate-then-check always passes and hides commit drift.
      - name: architecture2 compilation drift
        run: python3 scripts/generate_architecture2.py --check

      - name: Docs cross-refs (R3)
        run: python3 scripts/check_cross_refs.py --check

      - name: Milestone dependency (R3)
        run: python3 scripts/check_milestone_deps.py --check

      - name: Assumptions hygiene (R3)
        run: python3 scripts/check_assumptions_hygiene.py --check

      - name: Security review (static)
        run: python3 scripts/security_review.py --check

      # Risk lane: PR-range secret scan; full history runs weekly in weekly-ops.yml.
      - name: Secret scan (gitleaks v8.21.2, PR range)
        env:
          GL_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          curl -sSfLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "$GL_SHA256  gl.tgz" | sha256sum -c - && tar -xzf gl.tgz gitleaks
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$HEAD_SHA~1..$HEAD_SHA"
          else
            RANGE="$BASE..$HEAD_SHA"
          fi
          ./gitleaks git --redact --exit-code 1 --log-opts="$RANGE" .

      - name: Test suite (contracts, M0–M9, hardening, API, import boundary)
        run: pytest -v -rs

  commit-emails:
    name: commit emails (PR or push range)
    runs-on: ubuntu-latest
    # Recent runs: 3-6 s (47 jobs, REC-036). Default would be 360 min.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Allow-list author, committer, and *-by trailer emails
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Push: the pushed range before..after. Zero or unfetchable before is
          # handled (fail closed on the default branch) in the script docstring.
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PUSH_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # fetch-depth: 0 above has the full history of every branch; a force
          # push's old tip is unreachable, so fetch it by SHA (best effort).
          if [ -z "$BASE" ] && [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "$PUSH_BEFORE" || true
          fi
          python3 scripts/check_commit_trailers.py

  package-smoke:
    name: wheel / sdist smoke
    runs-on: ubuntu-latest
    # Recent runs: 14-25 s (47 jobs, REC-036). Default would be 360 min.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Assert migrations and policy ship in the artifacts
        run: |
          python3 - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          sql = [n for n in names if n.endswith(".sql")]
          assert any(n.endswith(".sqlite.sql") for n in sql), names
          assert any(n.endswith(".postgres.sql") for n in sql), names
          assert any(n.endswith("policy_default.json") for n in names), names

          with tarfile.open(sdists[0], "r:gz") as tf:
              sdist_names = tf.getnames()
          assert any(n.endswith(".sqlite.sql") for n in sdist_names), sdist_names
          assert any(n.endswith(".postgres.sql") for n in sdist_names), sdist_names
          assert any(n.endswith("policy_default.json") for n in sdist_names), sdist_names
          print("wheel sql:", sql)
          PY

      - name: Install wheel in a clean venv and smoke
        run: |
          python3 -m venv /tmp/rec-smoke
          /tmp/rec-smoke/bin/pip install dist/*.whl
          /tmp/rec-smoke/bin/python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from recertia.policy_load import load_policy
          from recertia.store import apply_sqlite_migrations, list_migrations

          sqlite = list_migrations(dialect="sqlite")
          postgres = list_migrations(dialect="postgres")
          assert sqlite, "installed package applied 0 sqlite migrations"
          assert postgres, "installed package shipped 0 postgres migrations"
          with TemporaryDirectory() as tmp:
              applied = apply_sqlite_migrations(Path(tmp) / "store.sqlite")
          assert applied, applied
          policy = load_policy()
          assert policy.version
          print("migrations", [p.name for p in sqlite], "policy", policy.version)
          PY
          /tmp/rec-smoke/bin/recertia --help

  container-smoke:
    name: container sandbox smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Pre-pull allowlisted image
        run: docker pull python:3.12-slim

      - name: Probe Docker
        run: |
          docker version
          docker run --rm --network=none --user 65534:65534 python:3.12-slim true

      - name: Container smoke (script)
        env:
          RECERTIA_EXECUTION_BACKEND: container
          RECERTIA_CONTAINER_RUNTIME: docker
          # Until rootless GID mapping lands; never enable on multi-tenant hosts.
          RECERTIA_WORKDIR_WORLD_WRITE: "1"
        run: python3 scripts/smoke_container.py

      - name: Container smoke (pytest)
        env:
          RECERTIA_EXECUTION_BACKEND: container
          RECERTIA_CONTAINER_RUNTIME: docker
          RECERTIA_WORKDIR_WORLD_WRITE: "1"
          # The real-docker timeout test fails (instead of skipping) here if Docker or the
          # pre-pulled python:3.12-slim image is missing.
          RECERTIA_REQUIRE_REAL_DOCKER: "1"
        run: pytest -v -rs tests/e2e/test_container_smoke.py tests/runtime/test_hung_command_timeouts.py

  # REC-058 (MF-D in CTO-rec's PR #163 review): run the root-lock tests against the real
  # kernel32 on Windows, which a fake kernel32 on Linux cannot prove. A separate job, so
  # the required `ci` check keeps its name; no secrets, read-only token, SHA-pinned actions
  # (the same pins as weekly-ops.yml and heldout-operator.yml).
  windows-root-lock:
    name: root lock (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RECERTIA_NO_NETWORK: "1"
      # The guard below fails the job unless at least this many root-lock tests pass.
      # Raise it whenever a root-lock test is added (REC-058 MF-1).
      ROOT_LOCK_MIN_PASSED: "111"
      # Same rule for the `-m windows` run (test_root_lock_windows_real.py), so a
      # real-Windows test cannot drop out of the selection unnoticed.
      WINDOWS_MARKED_MIN_PASSED: "20"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Selection: every test in tests/unit/persistence whose file or test name contains
      # `root_lock`; a new tests/unit/persistence/test_root_lock_*.py file is picked up as
      # is (the `windows` marker labels real-Windows tests but does not select them, so
      # their file name must contain root_lock). `-o timeout_method=thread`: pyproject sets
      # `signal`, and SIGALRM does not exist on Windows. pytest exits non-zero on a failure,
      # an error or nothing collected; the guard then fails the job on any skipped test
      # (xfail counts as skipped in JUnit), on fewer than ROOT_LOCK_MIN_PASSED passes, and
      # on a missing or empty JUnit report. Every selected test must run here.
      - name: Root-lock tests (real Windows)
        run: |
          python --version
          python -m pytest tests/unit/persistence -k root_lock -rs -v \
            -o timeout_method=thread --junitxml=root-lock-windows.xml
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("root-lock-windows.xml")
          raw_minimum = os.environ.get("ROOT_LOCK_MIN_PASSED", "")
          try:
              minimum = int(raw_minimum)
          except ValueError:
              sys.exit(f"guard: ROOT_LOCK_MIN_PASSED={raw_minimum!r} is not an integer")
          if minimum < 1:
              sys.exit(f"guard: ROOT_LOCK_MIN_PASSED={minimum} is below 1; a zero minimum passes nothing")
          if not report.is_file():
              sys.exit(f"guard: {report} is missing")
          try:
              root = ET.parse(report).getroot()
          except ET.ParseError as exc:
              sys.exit(f"guard: {report} is not valid JUnit XML: {exc}")
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          cases = [case for suite in suites for case in suite.iter("testcase")]
          if not suites or not cases:
              sys.exit(f"guard: {report} has no testsuite or no testcase results")
          counts = {"passed": 0, "skipped": 0, "failure": 0, "error": 0}
          for case in cases:
              outcome = next(
                  (tag for tag in ("skipped", "failure", "error") if case.find(tag) is not None),
                  "passed",
              )
              counts[outcome] += 1
          summary = {"report": report.name, **counts, "minimum_passed": minimum}
          if counts["skipped"] or counts["failure"] or counts["error"]:
              sys.exit(f"guard: a root-lock test was skipped, failed or errored on Windows: {summary}")
          if counts["passed"] < minimum:
              sys.exit(f"guard: {counts['passed']} root-lock tests passed, fewer than {minimum}: {summary}")
          print(f"guard: {summary}")
          PY

      # Selected by marker, not name: every `windows`-marked test must pass here too.
      - name: Windows-marked tests (real Windows)
        run: |
          python -m pytest tests/unit/persistence -m windows -rs -v \
            -o timeout_method=thread --junitxml=windows-marked.xml
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("windows-marked.xml")
          raw_minimum = os.environ.get("WINDOWS_MARKED_MIN_PASSED", "")
          try:
              minimum = int(raw_minimum)
          except ValueError:
              sys.exit(f"guard: WINDOWS_MARKED_MIN_PASSED={raw_minimum!r} is not an integer")
          if minimum < 1:
              sys.exit(f"guard: WINDOWS_MARKED_MIN_PASSED={minimum} is below 1; a zero minimum passes nothing")
          if not report.is_file():
              sys.exit(f"guard: {report} is missing")
          try:
              root = ET.parse(report).getroot()
          except ET.ParseError as exc:
              sys.exit(f"guard: {report} is not valid JUnit XML: {exc}")
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          cases = [case for suite in suites for case in suite.iter("testcase")]
          if not suites or not cases:
              sys.exit(f"guard: {report} has no testsuite or no testcase results")
          counts = {"passed": 0, "skipped": 0, "failure": 0, "error": 0}
          for case in cases:
              outcome = next(
                  (tag for tag in ("skipped", "failure", "error") if case.find(tag) is not None),
                  "passed",
              )
              counts[outcome] += 1
          summary = {"report": report.name, **counts, "minimum_passed": minimum}
          if counts["skipped"] or counts["failure"] or counts["error"]:
              sys.exit(f"guard: a windows-marked test was skipped, failed or errored: {summary}")
          if counts["passed"] < minimum:
              sys.exit(f"guard: {counts['passed']} windows-marked tests passed, fewer than {minimum}: {summary}")
          print(f"guard: {summary}")
          PY
