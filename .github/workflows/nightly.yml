name: nightly

# Not a required check. Python 3.11 at lowest-direct deps and 3.13 at newest:
# the batched import-all test (bugs 12 and 13), then the full test suite the way
# ci.yml runs it (REC-051).
#
# pip has no --resolution flag (that is uv). This repo's CI uses pip, so the
# lowest arm pins each direct dependency at its pyproject.toml floor and lets
# pip resolve remaining (transitive) deps. Both arms install the runtime deps plus
# the extras in NIGHTLY_EXTRAS (REC-057: postgres, pdf and otel too, not only dev).
#
# A failed or cancelled *scheduled* run opens (or comments on) one tracking issue,
# "nightly: scheduled run failing", through the alert job (REC-057 N5).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# No workflow-level grant; each job states its own below.
permissions: {}

jobs:
  import-all:
    name: import-all + suite (py${{ matrix.python-version }} ${{ matrix.deps }})
    runs-on: ubuntu-latest
    # The full suite takes ~2.5 min on ci.yml's 3.12; leave room for 3.11/3.13.
    timeout-minutes: 20
    permissions:
      contents: read # checkout only
    env:
      # Same as ci.yml: no real provider credentials, no non-loopback network.
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RECERTIA_NO_NETWORK: "1"
      # Extras both arms install; the lowest arm pins every one of their floors too.
      NIGHTLY_EXTRAS: dev,postgres,pdf,otel
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            deps: lowest
          - python-version: "3.13"
            deps: newest
    steps:
      - uses: actions/checkout@v4
        with:
          # The suite runs PyPI code; keep the job token out of .git/config (REC-057 N2).
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        id: install
        env:
          DEPS: ${{ matrix.deps }}
        run: |
          python -m pip install --upgrade pip
          if [ "$DEPS" = "lowest" ]; then
            python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          optional = data["project"]["optional-dependencies"]
          reqs = list(data["project"]["dependencies"])
          for extra in os.environ["NIGHTLY_EXTRAS"].split(","):
              reqs += optional[extra]
          pins = {}
          for req in reqs:
              if ";" in req:
                  raise SystemExit(f"environment markers are not supported here: {req}")
              head, ge, rest = req.partition(">=")
              if not ge:
                  raise SystemExit(f"direct dep has no >= floor: {req}")
              # A constraint cannot carry extras: psycopg[binary]>=3.2 pins psycopg==3.2.
              name = head.split("[", 1)[0].strip()
              pin = f"{name}=={rest.split(',', 1)[0].strip()}"
              if pins.setdefault(name.lower(), pin) != pin:
                  raise SystemExit(f"conflicting floors for {name}: {pins[name.lower()]} vs {pin}")
          Path("lowest-direct.txt").write_text("\n".join(pins.values()) + "\n")
          print("lowest-direct pins:")
          print("\n".join(pins.values()))
          PY
            pip install -e ".[$NIGHTLY_EXTRAS]" -c lowest-direct.txt
          else
            pip install -e ".[$NIGHTLY_EXTRAS]"
          fi

      - name: Import-all
        run: pytest -v tests/boundary/test_import_all_modules.py

      # Runs even if import-all failed, so both signals are kept; skipped if Install failed.
      - name: Test suite (same as ci.yml)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -v

  # REC-057 N5: a red scheduled nightly alerts someone. The job keeps one open issue
  # titled "nightly: scheduled run failing", created by github-actions[bot], with the
  # MARKER line in its body. It opens that issue, or comments on it if it is already
  # open, and skips a run id that is already reported (for example a re-run attempt).
  # Closing the issue is a human step. Manual dispatches never alert.
  # Hardening (CTO-rec rulings): schedule-only `if:`; no checkout and no `uses:` actions,
  # only the runner's `gh` CLI; every `${{ }}` value enters through `env:` and the body
  # holds run metadata only. This job holds the workflow's only write grant: job-scoped
  # `issues: write` on the built-in GITHUB_TOKEN. No secret is used.
  alert:
    name: alert on scheduled failure
    needs: import-all
    if: ${{ (failure() || cancelled()) && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # find, open or comment on the one tracking issue
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SERVER_URL: ${{ github.server_url }}
      WORKFLOW_NAME: ${{ github.workflow }}
      RUN_ID: ${{ github.run_id }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_SHA: ${{ github.sha }}
      NEEDS_RESULT: ${{ needs.import-all.result }}
      TITLE: "nightly: scheduled run failing"
      MARKER: "<!-- recertia-nightly-alert -->"
    steps:
      - name: Open or update the tracking issue
        run: |
          set -euo pipefail
          export RUN_KEY="<!-- run-id: ${RUN_ID} -->"
          run_url="${SERVER_URL}/${GH_REPO}/actions/runs/${RUN_ID}"
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          body=$(printf '%s\n%s\n\n- workflow: %s\n- run: %s (run %s, attempt %s)\n- sha: %s\n- needs.import-all.result: %s\n- reported at: %s\n' \
            "$MARKER" "$RUN_KEY" "$WORKFLOW_NAME" "$run_url" "$RUN_NUMBER" "$RUN_ATTEMPT" \
            "$RUN_SHA" "$NEEDS_RESULT" "$stamp")
          num=$(gh issue list --state open --author 'github-actions[bot]' --limit 100 \
            --json number,title,body \
            --jq '[.[] | select(.title == env.TITLE and (.body | contains(env.MARKER)))]
                  | sort_by(.number) | .[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "$TITLE" --body "$body"
            exit 0
          fi
          seen=$(gh issue view "$num" --json body,comments \
            --jq '[.body, .comments[].body] | map(select(contains(env.RUN_KEY))) | length')
          if [ "$seen" -gt 0 ]; then
            echo "run ${RUN_ID} is already reported on issue ${num}; not commenting again"
            exit 0
          fi
          gh issue comment "$num" --body "$body"
