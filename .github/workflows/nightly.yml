name: nightly

# Not a required check. Python 3.11 at lowest-direct deps and 3.13 at newest,
# plus the batched import-all test (bugs 12 and 13).
#
# pip has no --resolution flag (that is uv). This repo's CI uses pip, so the
# lowest arm pins each direct dependency at its pyproject.toml floor and lets
# pip resolve remaining (transitive) deps.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  import-all:
    name: import-all (py${{ matrix.python-version }} ${{ matrix.deps }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            deps: lowest
          - python-version: "3.13"
            deps: newest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          reqs = list(data["project"]["dependencies"])
          reqs += data["project"]["optional-dependencies"]["dev"]
          pins = []
          for req in reqs:
              head, ge, rest = req.partition(">=")
              if not ge:
                  raise SystemExit(f"direct dep has no >= floor: {req}")
              pins.append(f"{head.strip()}=={rest.split(',', 1)[0].strip()}")
          Path("lowest-direct.txt").write_text("\n".join(pins) + "\n")
          print("lowest-direct pins:")
          print("\n".join(pins))
          PY
            pip install -e ".[dev]" -c lowest-direct.txt
          else
            pip install -e ".[dev]"
          fi

      - name: Import-all
        run: pytest -v tests/boundary/test_import_all_modules.py
