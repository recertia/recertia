name: nightly

# Not a required check. Python 3.11 at lowest-direct deps and 3.13 at newest,
# plus the batched import-all test (bugs 12 and 13).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  import-all:
    name: import-all (py${{ matrix.python-version }} ${{ matrix.deps }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            deps: lowest
          - python-version: "3.13"
            deps: newest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            pip install -e ".[dev]" --resolution=lowest-direct
          else
            pip install -e ".[dev]"
          fi

      - name: Import-all
        run: pytest -v tests/boundary/test_import_all_modules.py
