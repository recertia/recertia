name: heldout-operator

# REC-022 (WO-rec-20261020-08). Operator-only, reproducible run of the PRIVATE held-out split.
# The public split under evals/golden/ stays the CI gate (ci.yml). This is not a required check.
# Design follows Harper-rec's ACCESS_STORAGE_PROPOSAL.md (WO-08 folder) §3-§5 and CTO-rec's
# WO-08 Amendment 1 (golden executor only, no model key, provider env empty).
#
# Fail closed: src/recertia/evals/heldout.py refuses debug logging, a non-empty provider env,
# and a reachable network; then verifies the pinned manifest sha256 and every input sha256 it
# lists, and exits non-zero before any eval runs on a mismatch, a missing file, or an unlisted
# file. A constructed model client exits 1. Console output is captured to a file, scanned for
# fixture ids, and printed only if the scan is clean. Per-fixture results go to the
# operator-only audit store. No artifacts, no caches, no step summary beyond counts.
#
# TODO(REC-022): PENDING Harper-rec's proposal §7 items AND Rob's approval of each exact change.
# Until then this workflow:
#   - references NO secret and NO deployment environment (proposal item 8-10: `heldout-operator`
#     environment, HELDOUT_* secrets and variables; none may be created or referenced yet),
#   - has NO fetch/decrypt step for the private split, NO age install, and NO audit-store sink.
#     The "Fetch private split" and "Persist to audit store" steps exit 1 on purpose,
#   - pins the manifest sha256 to a placeholder that fails the format check (WO-06 manifest),
#   - has NO `log-scan` job (proposal §4.12: needs `actions: read` plus the decrypted private
#     manifest; added with the secrets, not before).
# Debug guard: the proposal also checks secrets.ACTIONS_STEP_DEBUG / ACTIONS_RUNNER_DEBUG. This
# draft checks runner.debug, RUNNER_DEBUG, and the vars.* forms only, so that it references no
# secrets context before approval; when debug logging is on, runner.debug is "1" (proposal §7
# item 12 also confirms no such secret or variable exists).
# CTO-rec reviews every edit to this file.

on:
  workflow_dispatch:
    inputs:
      split_id:
        description: "Held-out split (choice only; no free-text inputs)"
        required: true
        type: choice
        options:
          - heldout-repo-chore-v1

permissions: {}

concurrency:
  group: heldout-operator
  cancel-in-progress: false

jobs:
  evaluate:
    # GitHub-hosted, ephemeral runner only. Never self-hosted (public repo).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # WO-08 Amendment 1: no model key; the provider env stays empty.
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RECERTIA_NO_NETWORK: "1"
      RECERTIA_EXECUTION_BACKEND: local
      RECERTIA_GOLDEN_BACKEND: local
      # TODO(REC-022): replace with the WO-06 manifest sha256 once Rob approves the split.
      HELDOUT_MANIFEST_SHA256: "TODO-REC-022-pending-approval"
    steps:
      - name: Refuse debug logging
        env:
          RUNNER_DEBUG_CTX: ${{ runner.debug }}
          VARS_STEP_DEBUG: ${{ vars.ACTIONS_STEP_DEBUG }}
          VARS_RUNNER_DEBUG: ${{ vars.ACTIONS_RUNNER_DEBUG }}
        run: |
          if [ "${RUNNER_DEBUG:-}" = "1" ] || [ "$RUNNER_DEBUG_CTX" = "1" ] \
             || [ -n "$VARS_STEP_DEBUG$VARS_RUNNER_DEBUG" ]; then
            echo "heldout: FAIL reason=debug_logging_on executed=0"
            exit 1
          fi

      - name: Refuse non-main ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "heldout: FAIL reason=ref_not_main executed=0"
            exit 1
          fi

      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-python v5.6.0. No dependency cache (the input is left unset).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Install pinned deps (hash-checked)
        run: python -m pip install -q --no-deps --require-hashes -r requirements/heldout-eval.txt

      - name: Fetch private split (PENDING approval; fails closed)
        env:
          SPLIT_ID: ${{ inputs.split_id }}
          SPLIT_ROOT: ${{ runner.temp }}/ho
        run: |
          # TODO(REC-022): proposal §3/§7 items 6, 9, 10: read-only deploy key, age identity,
          # data-repo URL. Decrypt to $SPLIT_ROOT (outside $GITHUB_WORKSPACE). Not approved yet.
          echo "heldout: FAIL reason=split_fetch_not_approved executed=0"
          exit 1

      # No network: the eval runs in a fresh network namespace (loopback only, down) via
      # `sudo unshare --net`, dropped back to the runner user with setpriv. The runner also
      # passes --require-offline, which refuses to start if any interface other than loopback exists.
      # stdout/stderr go to a file; it is printed only after the id scan passes.
      - name: Verify pinned inputs and evaluate (offline, output to file)
        env:
          SPLIT_ROOT: ${{ runner.temp }}/ho
          AUDIT_STORE: ${{ runner.temp }}/audit
          CONSOLE: ${{ runner.temp }}/console.txt
        run: |
          umask 077
          PY="$(command -v python)"
          set +e
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env -i PATH="$PATH" HOME="$HOME" PYTHONPATH=src:. \
            OPENAI_API_KEY= ANTHROPIC_API_KEY= RECERTIA_NO_NETWORK=1 \
            RECERTIA_EXECUTION_BACKEND=local RECERTIA_GOLDEN_BACKEND=local \
            "$PY" -m recertia.evals.heldout \
              --manifest "$SPLIT_ROOT/manifest.json" \
              --expected-sha256 "$HELDOUT_MANIFEST_SHA256" \
              --split-root "$SPLIT_ROOT" \
              --audit-store "$AUDIT_STORE" \
              --require-offline > "$CONSOLE" 2>&1
          rc=$?
          set -e
          PYTHONPATH=src:. python -m recertia.evals.heldout scan \
            --manifest "$SPLIT_ROOT/manifest.json" \
            --expected-sha256 "$HELDOUT_MANIFEST_SHA256" \
            --log "$CONSOLE"
          cat "$CONSOLE"
          exit "$rc"

      - name: Persist to audit store and clean up (PENDING approval; fails closed)
        if: always()
        env:
          SPLIT_ROOT: ${{ runner.temp }}/ho
          AUDIT_STORE: ${{ runner.temp }}/audit
          CONSOLE: ${{ runner.temp }}/console.txt
        run: |
          # TODO(REC-022): proposal §5 / §7 items 5, 7, 10: encrypt the record to Rob and the
          # operator and append it to the private audit repo. Never upload $AUDIT_STORE as an
          # artifact or cache, and never write it to $GITHUB_STEP_SUMMARY.
          rm -rf "$SPLIT_ROOT" "$AUDIT_STORE" "$CONSOLE"
          echo "heldout: FAIL reason=audit_sink_not_approved"
          exit 1
