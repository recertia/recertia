name: heldout-operator

# REC-022. Operator-only, reproducible run of the PRIVATE held-out split.
# The public split under evals/golden/ stays the CI gate (ci.yml). This is not a required check.
# Design: the access-storage proposal (§3-§5), the manifest spec and the review decisions
# (golden executor only with no model key, container backend only, container preflight,
# plan-node guard).
#
# Order. Every step fails closed before any eval runs:
#   guards (debug logging, non-main ref) -> pull the digest-pinned image (network still up)
#   -> fetch the ciphertext [TODO] -> verify the ciphertext sha256 against the public manifest
#   -> decrypt into $RUNNER_TEMP [TODO; ::add-mask:: right after] -> inside `unshare --net`
#   (setpriv --no-new-privs --clear-groups; docker via a uid ACL): preflight refusals, refuse
#   paths in the checkout, verify_heldout_tree on a copy staged in $RUNNER_TEMP/tmp,
#   the container preflight with --pull never, the golden executor in --network=none containers
#   -> scan the captured console for ids -> print it -> wipe (if: always()).
# Then job `log-scan` re-scans the published `evaluate` job log (proposal §4 item 12).
# Logs show only counts, hashes, and fixed reasons. No artifacts, no caches, no step summary.
#
# TODO(REC-022): PENDING the proposal's §7 items AND the owner's approval of each exact change.
# Until then this workflow:
#   - references NO secret and NO deployment environment (proposal items 8-10),
#   - has stub steps that exit 1 for fetch, decrypt, and the audit-store sink (both jobs),
#   - depends on the manifest evals/heldout/heldout-repo-chore-v1.manifest.json and
#     verify_heldout_tree (not on main yet; the runner fails closed with loader_unavailable).
# TODO(REC-022): `environment: heldout-operator` is added to BOTH jobs in the same
# change that adds the secrets, and only after the owner creates that environment with main-only
# deployment branches. Referencing it earlier would auto-create it without protection rules.
# Until then the main-only check below is advisory and the job must stay non-functional.
# Debug guard: the proposal also checks secrets.ACTIONS_*_DEBUG. This draft checks runner.debug,
# RUNNER_DEBUG, and the vars.* forms only, so it references no secrets context yet.
# TODO(REC-022): hash-pin pip and setuptools before the first real run (review residual).
# Every edit to this file is reviewed before merge.

on:
  workflow_dispatch:
    inputs:
      split_id:
        description: "Held-out split (choice only; no free-text inputs)"
        required: true
        type: choice
        options:
          - heldout-repo-chore-v1

permissions: {}

concurrency:
  group: heldout-operator
  cancel-in-progress: false

jobs:
  evaluate:
    # GitHub-hosted, ephemeral runner only. Never self-hosted (public repo).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # No model key: the provider env stays empty.
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RECERTIA_NO_NETWORK: "1"
      # Container backend only. Allowlisted python:3.12-slim, pinned by digest, so
      # solver/container.py passes --pull never; every sandbox runs with --network=none.
      RECERTIA_EXECUTION_BACKEND: container
      RECERTIA_GOLDEN_BACKEND: container
      RECERTIA_REQUIRE_IMAGE_DIGEST: "1"
      # Docker only: podman is also on the image, but rootless podman needs setuid
      # newuidmap, which --no-new-privs blocks. heldout.py refuses any other runtime.
      RECERTIA_CONTAINER_RUNTIME: docker
      RECERTIA_CONTAINER_IMAGE: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      # As in ci.yml container smoke: the sandbox user (65534) needs to write the bind-mounted
      # workdir on a single-tenant, ephemeral hosted runner.
      RECERTIA_WORKDIR_WORLD_WRITE: "1"
      HELDOUT_MANIFEST: evals/heldout/heldout-repo-chore-v1.manifest.json
    # TODO(REC-022): environment heldout-operator goes here, with the secrets (see header).
    steps:
      - name: Refuse debug logging
        env:
          RUNNER_DEBUG_CTX: ${{ runner.debug }}
          VARS_STEP_DEBUG: ${{ vars.ACTIONS_STEP_DEBUG }}
          VARS_RUNNER_DEBUG: ${{ vars.ACTIONS_RUNNER_DEBUG }}
        run: |
          if [ "${RUNNER_DEBUG:-}" = "1" ] || [ "$RUNNER_DEBUG_CTX" = "1" ] \
             || [ -n "$VARS_STEP_DEBUG$VARS_RUNNER_DEBUG" ]; then
            echo "heldout: FAIL reason=debug_logging_on executed=0"
            exit 1
          fi

      - name: Refuse non-main ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "heldout: FAIL reason=ref_not_main executed=0"
            exit 1
          fi

      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-python v5.6.0. No dependency cache (the input is left unset).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Install pinned deps (hash-checked)
        run: python -m pip install -q --no-deps --require-hashes -r requirements/heldout-eval.txt

      # Network is still up here. Anonymous public pull by digest; no secret in this step's env.
      - name: Pull allowlisted image by digest
        run: |
          docker pull -q "$RECERTIA_CONTAINER_IMAGE" > /dev/null
          docker image inspect "$RECERTIA_CONTAINER_IMAGE" > /dev/null

      - name: Fetch ciphertext (PENDING approval; fails closed)
        env:
          SPLIT_ID: ${{ inputs.split_id }}
          CIPHERTEXT: ${{ runner.temp }}/ct/split.tar.gz.age
        run: |
          # TODO(REC-022): proposal §3/§7 items 6, 9, 10 (read-only deploy key, data-repo URL).
          echo "heldout: FAIL reason=split_fetch_not_approved executed=0"
          exit 1

      - name: Verify ciphertext sha256 (before decrypt)
        env:
          PYTHONPATH: src:.
          CIPHERTEXT: ${{ runner.temp }}/ct/split.tar.gz.age
        run: |
          python -m recertia.evals.heldout verify-ciphertext \
            --manifest "$HELDOUT_MANIFEST" --ciphertext "$CIPHERTEXT"

      - name: Decrypt into RUNNER_TEMP (PENDING approval; fails closed)
        env:
          SPLIT_ROOT: ${{ runner.temp }}/ho
          KEY_DIR: ${{ runner.temp }}/keys
        run: |
          umask 077
          # The key file never outlives this step, whatever happens below.
          trap 'rm -rf "$KEY_DIR"' EXIT
          # TODO(REC-022): proposal §3 item 9 (age identity). Write the identity to $KEY_DIR only,
          # decrypt to $SPLIT_ROOT only (outside $GITHUB_WORKSPACE). Not approved yet.
          # TODO(REC-022) proposal §4 item 8: RIGHT AFTER decrypting and before any
          # echo, emit `::add-mask::` (shell variables only, never an expression) for every fixture dir
          # name, every skill id, the first 40 chars of each request, and $SPLIT_ROOT. A test
          # fails if this step stops being a stub without an add-mask line.
          echo "heldout: FAIL reason=decrypt_not_approved executed=0"
          exit 1

      # No network: a fresh network namespace (loopback only, down) via `sudo unshare --net`,
      # dropped back to the runner uid/gid with setpriv:
      #   --no-new-privs  sudo/setuid can't regain root, so no `sudo nsenter` back to the host
      #                   netns.
      #   --clear-groups  drops EVERY supplementary group (docker, adm, sudo-capable ones).
      # How only the harness gets docker access: before the netns, a uid ACL (setfacl
      # u:<runner uid>:rw) is put on the docker socket, so docker access no longer rides on a
      # group. Inside the netns the only host process with that uid is the harness
      # (python -m recertia.evals.heldout). Every fixture command runs in a --network=none
      # container as uid 65534 with no socket mounted (tracked; a non-container run fails), so
      # no fixture code reaches the daemon. The docker CLI reaches the daemon over the
      # filesystem unix socket, which a netns does not isolate. env -i passes only what the runner needs, including TMPDIR (staging stays in
      # $RUNNER_TEMP) and RUNNER_DEBUG (the in-module debug refusal stays live).
      # The runner refuses if any non-loopback interface exists (--require-offline).
      # The console goes to a file and is printed only after the id scan passes.
      - name: Verify root and count, container preflight, evaluate (offline)
        env:
          CIPHERTEXT: ${{ runner.temp }}/ct/split.tar.gz.age
          SPLIT_ROOT: ${{ runner.temp }}/ho
          AUDIT_STORE: ${{ runner.temp }}/audit
          CONSOLE: ${{ runner.temp }}/console.txt
          HO_TMP: ${{ runner.temp }}/tmp
        run: |
          umask 077
          mkdir -p "$HO_TMP"
          PY="$(command -v python)"
          SOCK=/var/run/docker.sock
          if [ ! -S "$SOCK" ] || ! command -v setfacl > /dev/null; then
            echo "heldout: FAIL reason=docker_socket_or_setfacl_missing executed=0"
            exit 1
          fi
          sudo setfacl -m "u:$(id -u):rw" "$SOCK"
          set +e
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" \
            --clear-groups --no-new-privs \
            env -i PATH="$PATH" HOME="$HOME" PYTHONPATH=src:. TMPDIR="$HO_TMP" \
            RUNNER_TEMP="$RUNNER_TEMP" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_DEBUG="${RUNNER_DEBUG:-}" \
            OPENAI_API_KEY= ANTHROPIC_API_KEY= RECERTIA_NO_NETWORK=1 \
            RECERTIA_EXECUTION_BACKEND=container RECERTIA_GOLDEN_BACKEND=container \
            RECERTIA_REQUIRE_IMAGE_DIGEST=1 RECERTIA_CONTAINER_IMAGE="$RECERTIA_CONTAINER_IMAGE" \
            RECERTIA_CONTAINER_RUNTIME=docker \
            RECERTIA_WORKDIR_WORLD_WRITE=1 \
            "$PY" -m recertia.evals.heldout \
              --manifest "$HELDOUT_MANIFEST" \
              --ciphertext "$CIPHERTEXT" \
              --split-root "$SPLIT_ROOT" \
              --audit-store "$AUDIT_STORE" \
              --require-offline > "$CONSOLE" 2>&1
          rc=$?
          set -e
          PYTHONPATH=src:. python -m recertia.evals.heldout scan \
            --split-root "$SPLIT_ROOT" --log "$CONSOLE"
          cat "$CONSOLE"
          exit "$rc"

      - name: Persist to audit store (PENDING approval; fails closed)
        if: always()
        env:
          AUDIT_STORE: ${{ runner.temp }}/audit
        run: |
          # TODO(REC-022): proposal §5 / §7 items 5, 7, 10: encrypt the record to the owner's two
          # recipients only (HELDOUT_AUDIT_RECIPIENTS: the owner's key and recovery key) and append it to the
          # private audit repo. Never upload $AUDIT_STORE as an artifact or cache, and never write
          # it to $GITHUB_STEP_SUMMARY.
          echo "heldout: FAIL reason=audit_sink_not_approved"
          exit 1

      # Always last, always runs: no ciphertext, plaintext, staged copy, key file, record or
      # console survives the job, and the docker-socket uid ACL is revoked.
      - name: Wipe held-out material
        if: always()
        env:
          RT: ${{ runner.temp }}
        run: |
          rm -rf "$RT/ct" "$RT/ho" "$RT/tmp" "$RT/keys" "$RT/audit" "$RT/console.txt"
          find "$RT" -maxdepth 2 -name '*.key' -type f -delete
          SOCK=/var/run/docker.sock
          if [ -S "$SOCK" ] && command -v setfacl > /dev/null; then
            sudo setfacl -x "u:$(id -u)" "$SOCK" 2> /dev/null || echo "heldout: acl_not_present"
          fi
          echo "heldout: wiped"

  # Proposal §4 item 12: re-scan what was actually PUBLISHED. Fetch the finished
  # `evaluate` job's log with the job token (actions: read) and grep it for every deny term.
  # A hit fails this job; the owner then deletes that run's logs (only the owner deletes).
  log-scan:
    needs: evaluate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    # TODO(REC-022): environment heldout-operator goes here too, with the secrets.
    env:
      HELDOUT_MANIFEST: evals/heldout/heldout-repo-chore-v1.manifest.json
    steps:
      - name: Refuse debug logging
        env:
          RUNNER_DEBUG_CTX: ${{ runner.debug }}
          VARS_STEP_DEBUG: ${{ vars.ACTIONS_STEP_DEBUG }}
          VARS_RUNNER_DEBUG: ${{ vars.ACTIONS_RUNNER_DEBUG }}
        run: |
          if [ "${RUNNER_DEBUG:-}" = "1" ] || [ "$RUNNER_DEBUG_CTX" = "1" ] \
             || [ -n "$VARS_STEP_DEBUG$VARS_RUNNER_DEBUG" ]; then
            echo "log-scan: FAIL reason=debug_logging_on"
            exit 1
          fi

      - name: Refuse non-main ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "log-scan: FAIL reason=ref_not_main"
            exit 1
          fi

      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # actions/setup-python v5.6.0. No dependency cache (the input is left unset).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Install pinned deps (hash-checked)
        run: python -m pip install -q --no-deps --require-hashes -r requirements/heldout-eval.txt

      - name: Fetch the published evaluate job log
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ runner.temp }}/published.log
        run: |
          umask 077
          JOB_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "evaluate") | .id')"
          if ! [[ "$JOB_ID" =~ ^[0-9]+$ ]]; then
            echo "log-scan: FAIL reason=job_not_found"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" > "$PUBLISHED"
          echo "log-scan: fetched bytes=$(wc -c < "$PUBLISHED")"

      - name: Fetch and decrypt the split for the deny list (PENDING approval; fails closed)
        env:
          SPLIT_ROOT: ${{ runner.temp }}/ho
          KEY_DIR: ${{ runner.temp }}/keys
        run: |
          umask 077
          trap 'rm -rf "$KEY_DIR"' EXIT
          # TODO(REC-022): same fetch, ciphertext check and decrypt as `evaluate` (proposal §3
          # item 9), followed by the same ::add-mask:: lines. Not approved yet.
          echo "log-scan: FAIL reason=decrypt_not_approved"
          exit 1

      - name: Scan the published log
        env:
          PYTHONPATH: src:.
          SPLIT_ROOT: ${{ runner.temp }}/ho
          PUBLISHED: ${{ runner.temp }}/published.log
        run: |
          # TODO(REC-022): on a hit, alert the owner to delete this run's logs (proposal §4 item 12).
          # Public text: this workflow file plus the env values GitHub echoes into the log.
          PUBLIC="$RUNNER_TEMP/public.txt"
          { cat .github/workflows/heldout-operator.yml; printf '%s\n' "$RUNNER_TEMP" "$SPLIT_ROOT"; } > "$PUBLIC"
          python -m recertia.evals.heldout scan --split-root "$SPLIT_ROOT" --log "$PUBLISHED" \
            --public-text "$PUBLIC"

      - name: Wipe held-out material
        if: always()
        env:
          RT: ${{ runner.temp }}
        run: |
          rm -rf "$RT/ct" "$RT/ho" "$RT/tmp" "$RT/keys" "$RT/published.log" "$RT/public.txt"
          find "$RT" -maxdepth 2 -name '*.key' -type f -delete
          echo "log-scan: wiped"
